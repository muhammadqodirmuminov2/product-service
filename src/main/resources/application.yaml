spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/businesshub}
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/product_db}
    username: ${DB_USER:product_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8083

management:
  endpoint:
    health:
      show-details: always   # faqat lokal uchun, prod'da o'chiramiz

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"